<form [formGroup]="formSignUp" (submit)="onSubmit()">
    <div class="control" [class.invalid]="formSignUp.get('username')?.invalid">
        <label for="username">Usuario</label>
        <input id="username" formControlName="username" type="text">
        <div class="error-message">
            <p *ngIf="formSignUp.get('username')?.hasError('required')">El nombre de usuario es obligatorio</p>
        </div>
    </div>

    <div class="control" [class.invalid]="formSignUp.get('email')?.invalid">
        <label for="email">Email</label>
        <input id="email" formControlName="email" type="text">
        <div class="error-message">
            <p *ngIf="formSignUp.get('email')?.hasError('required')">El email es obligatorio</p>
            <p *ngIf="formSignUp.get('email')?.hasError('email')">El formato no es válido</p>
        </div>
    </div>

    <div class="control" [class.invalid]="formSignUp.get('password')?.invalid">
        <label for="password">Contraseña</label>
        <input id="password" formControlName="password" type="text">
        <div class="error-message">
            <p *ngIf="formSignUp.get('password')?.hasError('required')">La contraseña es obligatoria</p>
            <p *ngIf="formSignUp.get('password')?.hasError('minlength')">La contraseña debe tener mínimo 6 caracteres</p>
        </div>
    </div>

    <div class="control">
        <label for="confirmPassword">Confirmar contraseña</label>
        <input id="confirmPassword" formControlName="confirmPassword" type="text">
        <div class="error-message">
            <p *ngIf="formSignUp.hasError('passwordMismatch')">Las contraseñas no coinciden</p>
        </div>
    </div>

    <button [disabled]="formSignUp.invalid" type="submit" class="btn btn-primary">Registrate</button>

</form>

<button class="btn btn-secondary" (click)="setDefaultValues()">Cargar default</button>
